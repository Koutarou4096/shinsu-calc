<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進数変換電卓（計算過程つき）</title>

    <!-- Tailwind CSSをCDNから読み込み、画面のレイアウトや装飾に使用する。 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 画面表示用のフォントを読み込む。 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- ボタン等に使用するLucideアイコンを読み込む。 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        /*
         * Tailwind CSSの設定。
         * ここではアプリ全体で使用するフォントとブランドカラーを定義する。
         */
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                        }
                    }
                }
            }
        };
    </script>

    <style>
        body {
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .math-block {
            background-color: #f8fafc;
            border-left: 4px solid #14b8a6;
            padding: 1rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
        }

        .step-title {
            font-weight: 600;
            color: #334155;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 text-slate-800">

    <main class="w-full max-w-3xl bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl overflow-hidden border border-slate-200">
        <!-- ヘッダー -->
        <header class="bg-brand-600 p-6 text-white text-center">
            <h1 class="text-2xl sm:text-3xl font-bold flex items-center justify-center gap-3">
                <i data-lucide="binary" class="w-8 h-8" aria-hidden="true"></i>
                進数変換電卓
            </h1>
            <p class="text-brand-100 mt-2 text-sm sm:text-base">
                2進数・8進数・10進数・16進数の変換に対応。計算のステップも詳しく解説します。
            </p>
        </header>
