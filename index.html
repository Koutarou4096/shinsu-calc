<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進数変換電卓（計算過程つき）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        .math-block {
            background-color: #f8fafc;
            border-left: 4px solid #14b8a6;
            padding: 1rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
        }

        .step-title {
            font-weight: 600;
            color: #334155;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 text-slate-800">

    <main class="w-full max-w-3xl bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <header class="bg-brand-600 p-6 text-white text-center">
            <h1 class="text-2xl sm:text-3xl font-bold flex items-center justify-center gap-3">
                <i data-lucide="binary" class="w-8 h-8"></i>
                進数変換電卓
            </h1>
            <p class="text-brand-100 mt-2 text-sm sm:text-base">2進数から36進数までの変換に対応。計算のステップも詳しく解説します。</p>
        </header>

        <section class="p-6 sm:p-8">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-6 items-end">
                
                <!-- From Base -->
                <div class="md:col-span-2 space-y-2">
                    <label class="block text-sm font-medium text-slate-600">変換元の進数</label>
                    <select id="from-base" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                        <!-- Options generated by JS -->
                    </select>
                </div>

                <!-- Swap Button -->
                <div class="flex justify-center md:col-span-1 pb-1">
                    <button id="swap-btn" class="p-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full transition-colors active:scale-95" title="進数を入れ替える">
                        <i data-lucide="arrow-left-right" class="w-5 h-5 hidden md:block"></i>
                        <i data-lucide="arrow-up-down" class="w-5 h-5 block md:hidden"></i>
                    </button>
                </div>

                <!-- To Base -->
                <div class="md:col-span-2 space-y-2">
                    <label class="block text-sm font-medium text-slate-600">変換先の進数</label>
                    <select id="to-base" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                        <!-- Options generated by JS -->
                    </select>
                </div>
            </div>

            <!-- Number Input -->
            <div class="mt-6 space-y-2">
                <label class="block text-sm font-medium text-slate-600">変換する数値</label>
                <div class="relative">
                    <input type="text" id="num-input" placeholder="数値を入力してください (例: 10, 1011, FF)" 
                        class="w-full p-4 text-lg font-mono bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all uppercase placeholder:normal-case placeholder:text-slate-400">
                    <div id="error-msg" class="absolute -bottom-6 left-1 text-xs text-red-500 font-medium hidden">選択した進数に対して無効な入力です。</div>
                </div>
            </div>

            <!-- Convert Button -->
            <button id="convert-btn" class="w-full mt-8 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-4 rounded-xl shadow-lg shadow-brand-500/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                <i data-lucide="calculator" class="w-5 h-5"></i>
                計算する
            </button>
        </section>

        <section id="result-section" class="hidden border-t border-slate-100 bg-slate-50 p-6 sm:p-8 fade-in">
            <!-- Final Result Box -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center mb-8">
                <p class="text-sm text-slate-500 font-medium uppercase tracking-wider mb-2">変換結果</p>
                <div class="text-4xl sm:text-5xl font-bold font-mono text-brand-600 break-all" id="final-result">
                    <!-- Result goes here -->
                </div>
                <p class="text-slate-400 mt-2 text-sm" id="result-subtext"></p>
            </div>

            <!-- Steps Container -->
            <div>
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2">
                    <i data-lucide="list-ordered" class="w-6 h-6 text-brand-500"></i>
                    計算のステップ
                </h3>
                <div id="steps-container" class="mt-4 text-slate-700 leading-relaxed">
                    <!-- Dynamic steps go here -->
                </div>
            </div>
        </section>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // DOM Elements
        const fromBaseSelect = document.getElementById('from-base');
        const toBaseSelect = document.getElementById('to-base');
        const numInput = document.getElementById('num-input');
        const swapBtn = document.getElementById('swap-btn');
        const convertBtn = document.getElementById('convert-btn');
        const errorMsg = document.getElementById('error-msg');
        const resultSection = document.getElementById('result-section');
        const finalResultEl = document.getElementById('final-result');
        const resultSubtextEl = document.getElementById('result-subtext');
        const stepsContainer = document.getElementById('steps-container');

        // [FIX 1] Populate base options from 2 to 36 (was hardcoded to only 2, 8, 10, 16,
        // which contradicted the header claiming support for "2進数から36進数まで")
        function populateBases() {
            for (let i = 2; i <= 36; i++) {
                const option1 = document.createElement('option');
                option1.value = i;
                option1.textContent = `${i}進数`;

                const option2 = document.createElement('option');
                option2.value = i;
                option2.textContent = `${i}進数`;

                fromBaseSelect.appendChild(option1);
                toBaseSelect.appendChild(option2);
            }
            // Set defaults
            fromBaseSelect.value = '10';
            toBaseSelect.value = '2';
        }
        populateBases();

        // Swap functionality
        swapBtn.addEventListener('click', () => {
            const temp = fromBaseSelect.value;
            fromBaseSelect.value = toBaseSelect.value;
            toBaseSelect.value = temp;
            
            // Re-validate input if there is any
            if(numInput.value) {
                validateInput();
            }
        });

        // Input validation listener
        numInput.addEventListener('input', validateInput);
        fromBaseSelect.addEventListener('change', validateInput);

        function validateInput() {
            let val = numInput.value.trim().toUpperCase();
            let base = parseInt(fromBaseSelect.value, 10);
            
            if (val === '') {
                hideError();
                return true;
            }

            // Valid characters for base up to 36
            const validChars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".slice(0, base);
            const regex = new RegExp(`^[${validChars}]+$`);

            if (!regex.test(val)) {
                showError(`${base}進数として無効な文字が含まれています。`);
                return false;
            } else {
                hideError();
                return true;
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            numInput.classList.add('border-red-500', 'focus:ring-red-500');
            numInput.classList.remove('border-slate-200', 'focus:ring-brand-500');
        }

        function hideError() {
            errorMsg.classList.add('hidden');
            numInput.classList.remove('border-red-500', 'focus:ring-red-500');
            numInput.classList.add('border-slate-200', 'focus:ring-brand-500');
        }

        // Helper to format superscripts
        function formatPower(base, power) {
            return `${base}<sup>${power}</sup>`;
        }

        // [FIX 2] Generate Steps to Decimal — now uses BigInt throughout so large inputs
        // (beyond Number.MAX_SAFE_INTEGER, ~2^53) no longer silently produce wrong results.
        function generateStepsToDecimal(valueStr, fromBase) {
            let html = `<div class="step-title"><div class="bg-brand-100 text-brand-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">1</div> ${fromBase}進数の ${valueStr} を 10進数 に変換する</div>`;
            html += `<p class="mb-2">10進数へ変換するには、各桁の数値に、その桁の重み（基数 ${fromBase} のべき乗）を掛け合わせて合計します。右端の桁の重みは ${fromBase}<sup>0</sup> です。</p>`;

            const baseBig = BigInt(fromBase);
            let sum = 0n;
            let calcParts = [];
            let detailParts = [];
            let length = valueStr.length;

            html += `<div class="math-block">`;

            for (let i = 0; i < length; i++) {
                let char = valueStr[i].toUpperCase();
                let digitVal = parseInt(char, fromBase);
                let power = length - 1 - i;
                let placeValue = baseBig ** BigInt(power);

                sum += BigInt(digitVal) * placeValue;

                // Show letter conversion for base > 10
                let charStr = char;
                if (fromBase > 10 && digitVal > 9) {
                    charStr = `${char}(${digitVal})`;
                }

                calcParts.push(`(${charStr} &times; ${formatPower(fromBase, power)})`);
                detailParts.push(`(${digitVal} &times; ${placeValue.toString()})`);
            }

            html += `計算 = ${calcParts.join(' + ')}<br>`;
            html += `計算 = ${detailParts.join(' + ')}<br>`;
            html += `<strong>結果 = ${sum.toString()}<sub>10</sub></strong>`;
            html += `</div>`;

            return { html, sum }; // sum is a BigInt
        }

        // [FIX 2 cont.] Generate Steps from Decimal — decimalValue is now expected to be a BigInt.
        function generateStepsFromDecimal(decimalValue, toBase, stepNumber = 1) {
            let html = `<div class="step-title"><div class="bg-brand-100 text-brand-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">${stepNumber}</div> 10進数の ${decimalValue.toString()} を ${toBase}進数 に変換する</div>`;
            html += `<p class="mb-2">10進数を ${toBase}進数に変換するには、数値を ${toBase} で繰り返し割り、その余りを求めます。下から上に向かって余りを並べたものが答えになります。</p>`;

            if (decimalValue === 0n) {
                html += `<div class="math-block">0 &divide; ${toBase} = 0, 余り 0<br><br>結果 = 0</div>`;
                return { html, resultStr: "0" };
            }

            const baseBig = BigInt(toBase);
            let currentVal = decimalValue;
            let remainders = [];

            html += `<div class="math-block">`;
            html += `<table class="w-full text-left border-collapse">`;
            html += `<tr><th class="border-b border-slate-300 pb-1 pr-4">割り算</th><th class="border-b border-slate-300 pb-1 pr-4">商</th><th class="border-b border-slate-300 pb-1">余り</th></tr>`;

            while (currentVal > 0n) {
                let quotient = currentVal / baseBig;
                let remainderBig = currentVal % baseBig;
                // remainderBig is always < toBase (<= 36), so converting to Number is always safe here.
                let remainderNum = Number(remainderBig);
                let remStr = remainderNum.toString(toBase).toUpperCase();

                let displayRem = remainderNum > 9 ? `${remainderNum} &rarr; <strong>${remStr}</strong>` : `<strong>${remStr}</strong>`;

                html += `<tr>`;
                html += `<td class="py-1 pr-4 text-slate-500">${currentVal.toString()} &divide; ${toBase}</td>`;
                html += `<td class="py-1 pr-4">${quotient.toString()}</td>`;
                html += `<td class="py-1 text-brand-600">${displayRem}</td>`;
                html += `</tr>`;

                remainders.push(remStr);
                currentVal = quotient;
            }
            html += `</table>`;

            let finalResult = remainders.reverse().join('');
            html += `<div class="mt-4 pt-4 border-t border-slate-200">`;
            html += `余りを下から順に読む: <strong>${finalResult}</strong>`;
            html += `</div></div>`;

            return { html, resultStr: finalResult };
        }

        // Main Conversion Handler
        convertBtn.addEventListener('click', () => {
            const valStr = numInput.value.trim().toUpperCase();
            const fromBase = parseInt(fromBaseSelect.value, 10);
            const toBase = parseInt(toBaseSelect.value, 10);

            if (valStr === '') {
                showError("変換する数値を入力してください。");
                return;
            }

            if (!validateInput()) {
                return;
            }

            let stepsHTML = '';
            let finalResultStr = '';

            // Same base scenario
            if (fromBase === toBase) {
                stepsHTML = `<p class="text-slate-600 italic">変換元と変換先の進数が同じです。変換の必要はありません。</p>`;
                finalResultStr = valStr;
            } 
            // Any base to Decimal
            else if (toBase === 10) {
                const { html, sum } = generateStepsToDecimal(valStr, fromBase);
                stepsHTML = html;
                finalResultStr = sum.toString();
            }
            // Decimal to Any base
            else if (fromBase === 10) {
                // Use BigInt to parse directly — avoids precision loss for very large decimal input.
                const decimalValue = BigInt(valStr);
                const { html, resultStr } = generateStepsFromDecimal(decimalValue, toBase, 1);
                stepsHTML = html;
                finalResultStr = resultStr;
            }
            // Any to Any (via Decimal)
            else {
                // Step 1: To Decimal
                const step1 = generateStepsToDecimal(valStr, fromBase);
                stepsHTML += step1.html;
                
                // Step 2: From Decimal to Target
                const step2 = generateStepsFromDecimal(step1.sum, toBase, 2);
                stepsHTML += step2.html;
                
                finalResultStr = step2.resultStr;
            }

            // Update UI
            finalResultEl.textContent = finalResultStr;
            resultSubtextEl.innerHTML = `<strong>${fromBase}進数</strong> から <strong>${toBase}進数</strong> への変換結果`;
            stepsContainer.innerHTML = stepsHTML;
            
            // Show result section and scroll to it
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // Allow Enter key to trigger calculation
        numInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                convertBtn.click();
            }
        });
    </script>
</body>
</html>
